# Local in-process orchestrator settings
orchestrator.storage-dir=${java.io.tmpdir}/pipeline-orchestrator
orchestrator.persistence-enabled=false
orchestrator.max-in-flight-per-pipeline=16
orchestrator.max-queued-per-pipeline=64
# REJECT: fail when in-flight cap is hit; QUEUE: buffer up to max-queued-per-pipeline
orchestrator.overflow-policy=REJECT
orchestrator.queue-pump-delay-ms=100

logging.level.com.github.h3yow.pipelinereleaseorchestratorjava=INFO
logging.level.pipeline.audit=INFO
