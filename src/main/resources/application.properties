# Local storage directory for append-only JSONL streams
orchestrator.storage-dir=data/pipeline
# Maximum number of pipeline runs executing concurrently
orchestrator.max-concurrent-runs=4
# Maximum number of queued runs (only used when reject-policy=QUEUE)
orchestrator.queue-capacity=100
# QUEUE: accept and queue up to queue-capacity backlog; REJECT: fail as soon as all workers are busy
orchestrator.reject-policy=QUEUE
# Default retry policy applied to retryable stage failures
orchestrator.default-max-attempts=3
orchestrator.default-initial-backoff-millis=50
orchestrator.default-max-backoff-millis=5000
